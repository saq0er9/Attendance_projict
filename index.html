<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة مراقبة الحضور والمخالفات</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">
    <div class="max-w-6xl mx-auto">
      
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
            <h1 class="text-2xl font-bold text-gray-700">نظام مراقبة الحضور والسلوك الحي</h1>
            <div id="status" class="px-3 py-1 bg-yellow-500 text-white font-semibold rounded">
                جاري الاتصال بالسيرفر...
            </div>
        </header>

       
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
           
            <div class="bg-white p-5 rounded-lg shadow">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span>📋</span> سجل عمليات التبصيم الحية
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-200 text-gray-700">
                                <th class="p-2 border-b">رقم الطالب</th>
                                <th class="p-2 border-b">الاسم</th>
                                <th class="p-2 border-b">القاعة</th>
                                <th class="p-2 border-b">الحالة</th>
                                <th class="p-2 border-b">الوقت</th>
                            </tr>
                        </thead>
                        <tbody id="checkin-table">
                           
                        </tbody>
                    </table>
                </div>
            </div>

           
            <div class="bg-white p-5 rounded-lg shadow">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-red-600">
                    <span>🚨</span> المخالفات والتنبيهات المباشرة
                </h2>
                <div id="alerts-list" class="space-y-3">
                   
                </div>
            </div>

        </div>
    </div>

    
    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
           
            const checkinTable = document.getElementById("checkin-table");
            if (checkinTable) {
                const newRow = `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 font-mono">${data.student_id || '-'}</td>
                        <td class="p-2 font-semibold">${data.student_name || 'طالب'}</td>
                        <td class="p-2">${data.room || '-'}</td>
                        <td class="p-2">
                            <span class="px-2 py-1 text-xs rounded text-white ${data.badge_status === 'Valid' ? 'bg-green-500' : 'bg-red-500'}">
                                ${data.badge_status}
                            </span>
                        </td>
                        <td class="p-2 text-xs text-gray-500">${new Date().toLocaleTimeString()}</td>
                    </tr>
                `;
                checkinTable.insertAdjacentHTML('afterbegin', newRow);
            }

           
            if (data.badge_status === "Expired") {
                const alertsList = document.getElementById("alerts-list");
                if (alertsList) {
                    const alertItem = `
                        <div class="p-3 bg-red-100 border-r-4 border-red-500 text-red-700 rounded shadow-sm">
                            <strong>تنبيه أمني (${data.student_id}):</strong> محاولة استخدام بطاقة منتهية الصلاحية بواسطة ${data.student_name}
                            <div class="text-xs text-gray-500 mt-1">${new Date().toLocaleTimeString()}</div>
                        </div>
                    `;
                    alertsList.insertAdjacentHTML('afterbegin', alertItem);
                }
            }
        };

        ws.onopen = function() {
            const statusDiv = document.getElementById("status");
            if (statusDiv) {
                statusDiv.innerText = "متصل بالسيرفر (مباشر)";
                statusDiv.className = "px-3 py-1 bg-green-500 text-white font-semibold rounded";
            }
        };

        ws.onclose = function() {
            const statusDiv = document.getElementById("status");
            if (statusDiv) {
                statusDiv.innerText = "انقطع الاتصال";
                statusDiv.className = "px-3 py-1 bg-red-500 text-white font-semibold rounded";
            }
        };
    </script>
</body>
</html>
